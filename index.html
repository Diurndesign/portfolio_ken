<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ken Lipari — Technicien Systèmes &amp; Réseaux | Lipatech</title>
  <meta name="description" content="Portfolio de Ken Lipari, technicien systèmes et réseaux (BTS SIO · SISR), Sophia Antipolis.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/main.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230c1410%22/><circle cx=%2250%22 cy=%2250%22 r=%2216%22 fill=%22none%22 stroke=%22%23b4e01a%22 stroke-width=%228%22/></svg>">
</head>
<body>

  <section class="hero">
    <svg class="mb" viewBox="0 0 1000 680" role="img" aria-label="Carte mère — Ken Lipari, technicien systèmes et réseaux">

      <defs>
        <linearGradient id="pcbSheen" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff" stop-opacity=".05"/>
          <stop offset=".45" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="cpuMetal" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#2c3640"/>
          <stop offset=".5" stop-color="#1a222a"/>
          <stop offset="1" stop-color="#0f151b"/>
        </linearGradient>
        <pattern id="pins" width="13" height="13" patternUnits="userSpaceOnUse">
          <circle cx="6.5" cy="6.5" r="2" fill="#2a343f"/>
        </pattern>
        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="2.6" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- ===== PCB ===== -->
      <rect class="pcb" x="20" y="20" width="960" height="640" rx="22"/>
      <rect class="pcb-sheen" x="20" y="20" width="960" height="640" rx="22"/>

      <!-- trous de montage -->
      <g>
        <circle class="hole-ring" cx="66" cy="66" r="20"/><circle class="hole" cx="66" cy="66" r="12"/>
        <circle class="hole-ring" cx="934" cy="66" r="20"/><circle class="hole" cx="934" cy="66" r="12"/>
        <circle class="hole-ring" cx="66" cy="614" r="20"/><circle class="hole" cx="66" cy="614" r="12"/>
        <circle class="hole-ring" cx="934" cy="614" r="20"/><circle class="hole" cx="934" cy="614" r="12"/>
      </g>

      <!-- ===== PISTES (cuivre / lime) ===== -->
      <g>
        <!-- bus CPU -> RAM -->
        <path class="trace" d="M400 190 H688"/>
        <path class="trace" d="M400 220 H688"/>
        <path class="trace trace--live" d="M400 250 H688"/>
        <path class="trace" d="M400 280 H688"/>
        <!-- CPU -> chipset -->
        <path class="trace" d="M250 400 V440"/>
        <path class="trace trace--live" d="M300 400 V440"/>
        <path class="trace" d="M350 400 V440"/>
        <!-- chipset -> PCIe -->
        <path class="trace" d="M430 470 H392 V465"/>
        <path class="trace" d="M430 500 H360 V512"/>
        <!-- ATX -> chipset -->
        <path class="trace trace--live" d="M876 476 H600"/>
        <!-- CPU -> I/O -->
        <path class="trace trace--dim" d="M300 178 V128"/>
        <path class="trace trace--dim" d="M340 178 V128 H470"/>
        <!-- vias -->
        <circle class="via" cx="400" cy="190" r="4"/><circle class="via" cx="688" cy="190" r="4"/>
        <circle class="via" cx="400" cy="250" r="4"/><circle class="via" cx="688" cy="250" r="4"/>
        <circle class="via via--dim" cx="400" cy="220" r="4"/><circle class="via via--dim" cx="400" cy="280" r="4"/>
        <circle class="via" cx="300" cy="440" r="4"/>
        <circle class="via" cx="600" cy="476" r="4"/>
      </g>

      <!-- impulsions de données -->
      <circle class="pulse" r="4"><animateMotion dur="2.6s" repeatCount="indefinite" path="M400 250 H688"/></circle>
      <circle class="pulse" r="4"><animateMotion dur="3.4s" repeatCount="indefinite" path="M876 476 H600"/></circle>
      <circle class="pulse" r="3.5"><animateMotion dur="2s" repeatCount="indefinite" path="M300 400 V440"/></circle>

      <!-- ===== VRM : condensateurs ===== -->
      <g>
        <circle class="cap" cx="180" cy="120" r="15"/><path class="cap-top" d="M172 120 H188 M180 112 V128"/>
        <circle class="cap" cx="220" cy="120" r="15"/><path class="cap-top" d="M212 120 H228 M220 112 V128"/>
        <circle class="cap" cx="260" cy="120" r="15"/><path class="cap-top" d="M252 120 H268 M260 112 V128"/>
        <circle class="cap" cx="300" cy="120" r="15"/><path class="cap-top" d="M292 120 H308 M300 112 V128"/>
        <circle class="cap" cx="340" cy="120" r="15"/><path class="cap-top" d="M332 120 H348 M340 112 V128"/>
        <text class="silk silk--label" x="150" y="90">VRM</text>
      </g>

      <!-- ===== CPU + socket ===== -->
      <g>
        <rect class="comp-2" x="150" y="150" width="250" height="250" rx="12"/>
        <rect x="164" y="164" width="222" height="222" fill="url(#pins)"/>
        <rect class="cpu-face" x="182" y="182" width="186" height="186" rx="6"/>
        <path class="cpu-mark" d="M196 210 V196 H210"/>
        <text class="silk" x="275" y="270" text-anchor="middle" font-size="26" fill="#c7e08a" opacity="0.9" font-weight="700">KL</text>
        <text class="silk silk--label" x="275" y="298" text-anchor="middle">LIPATECH · CPU</text>
        <text class="silk silk--label" x="150" y="145">SOCKET</text>
      </g>

      <!-- ===== RAM (4 slots) ===== -->
      <g>
        <text class="silk silk--label" x="706" y="120">DDR · RAM</text>
        <g>
          <rect class="slot" x="706" y="130" width="28" height="280" rx="4"/><rect class="slot-lip--lime" x="706" y="130" width="28" height="8" rx="4"/><rect x="706" y="300" width="28" height="6" fill="#05070a"/>
          <rect class="slot" x="748" y="130" width="28" height="280" rx="4"/><rect class="slot-lip--lime" x="748" y="130" width="28" height="8" rx="4"/><rect x="748" y="300" width="28" height="6" fill="#05070a"/>
          <rect class="slot" x="790" y="130" width="28" height="280" rx="4"/><rect class="slot-lip--lime" x="790" y="130" width="28" height="8" rx="4"/><rect x="790" y="300" width="28" height="6" fill="#05070a"/>
          <rect class="slot" x="832" y="130" width="28" height="280" rx="4"/><rect class="slot-lip--lime" x="832" y="130" width="28" height="8" rx="4"/><rect x="832" y="300" width="28" height="6" fill="#05070a"/>
        </g>
      </g>

      <!-- ===== Chipset + dissipateur ===== -->
      <g>
        <text class="silk silk--label" x="430" y="432">CHIPSET</text>
        <rect class="comp" x="430" y="440" width="170" height="150" rx="8"/>
        <path class="fin" d="M446 456 H584 M446 472 H584 M446 488 H584 M446 504 H584 M446 520 H584 M446 536 H584 M446 552 H584 M446 568 H584"/>
      </g>

      <!-- ===== PCIe (2 slots) ===== -->
      <g>
        <text class="silk silk--label" x="120" y="443">PCIe</text>
        <rect class="slot" x="120" y="450" width="270" height="26" rx="4"/><rect class="slot-lip--lime" x="120" y="450" width="6" height="26"/>
        <rect class="slot" x="120" y="495" width="220" height="26" rx="4"/><rect class="slot-lip--lime" x="120" y="495" width="6" height="26"/>
      </g>

      <!-- ===== I/O ===== -->
      <g>
        <text class="silk silk--label" x="430" y="66">I/O · USB / RJ45</text>
        <rect class="comp-2" x="430" y="74" width="180" height="50" rx="6"/>
        <rect class="comp" x="440" y="84" width="46" height="30" rx="3"/>
        <rect class="comp" x="494" y="84" width="46" height="30" rx="3"/>
        <rect class="comp" x="548" y="84" width="52" height="30" rx="3"/>
      </g>

      <!-- ===== ATX 24-pin ===== -->
      <g>
        <text class="silk silk--label" x="852" y="452">ATX</text>
        <rect class="comp-2" x="852" y="458" width="44" height="150" rx="6"/>
        <g fill="#05070a">
          <rect x="860" y="468" width="12" height="14" rx="2"/><rect x="876" y="468" width="12" height="14" rx="2"/>
          <rect x="860" y="488" width="12" height="14" rx="2"/><rect x="876" y="488" width="12" height="14" rx="2"/>
          <rect x="860" y="508" width="12" height="14" rx="2"/><rect x="876" y="508" width="12" height="14" rx="2"/>
          <rect x="860" y="528" width="12" height="14" rx="2"/><rect x="876" y="528" width="12" height="14" rx="2"/>
          <rect x="860" y="548" width="12" height="14" rx="2"/><rect x="876" y="548" width="12" height="14" rx="2"/>
          <rect x="860" y="568" width="12" height="14" rx="2"/><rect x="876" y="568" width="12" height="14" rx="2"/>
        </g>
      </g>

      <!-- ===== SÉRIGRAPHIE (identité) ===== -->
      <text class="silk silk--brand" x="60" y="58" font-size="24">LIPATECH</text>
      <text class="silk silk--label" x="62" y="76">MAINBOARD · REV 2026</text>

      <text class="silk silk--big" x="60" y="628">KEN LIPARI</text>
      <text class="silk silk--label" x="60" y="646">TECHNICIEN SYSTÈMES &amp; RÉSEAUX · BTS SIO · SISR</text>
      <text class="silk silk--label" x="940" y="646" text-anchor="end">SOPHIA ANTIPOLIS · PACA</text>

    </svg>
  </section>

  <script src="js/main.js" defer></script>
</body>
</html>
