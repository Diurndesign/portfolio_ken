          <stop offset=".5" stop-color="#0d2c16"/>

          <stop offset=".35" stop-color="#ffffff" stop-opacity="0"/>

        <radialGradient id="pcbVign" cx="50%" cy="42%" r="72%">
          <stop offset="60%" stop-color="#000" stop-opacity="0"/>
          <stop offset="100%" stop-color="#000" stop-opacity=".4"/>

        <linearGradient id="capBody" x1="0" y1="0" x2="1" y2="0">

        <g id="screw">

          <rect x="6" y="6" width="80" height="4" fill="#fff" opacity=".05"/>
