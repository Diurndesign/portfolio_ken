<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Ken – Technicien Systèmes &amp; Réseaux | BTS SIO SISR</title>
  <meta name="description" content="Portfolio de Ken, technicien systèmes et réseaux (BTS SIO option SISR). Un bureau interactif : ouvrez les dossiers pour découvrir son parcours, ses compétences et ses projets.">
  <meta name="author" content="Ken">
  <meta property="og:title" content="Ken – Technicien Systèmes & Réseaux">
  <meta property="og:description" content="Un portfolio interactif façon bureau d'ordinateur. Ouvrez les dossiers pour tout découvrir.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.lipatech.fr/">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/main.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖥️</text></svg>">
</head>
<body>

  <!-- ===================== LA SCÈNE (le bureau) ===================== -->
  <div class="scene">

    <!-- ---------- DESKTOP : un ThinkPad qui s'ouvre ---------- -->
    <div class="device device--desktop">
      <div class="stage" id="stage">

        <!-- Nom de marque en grand (intro) -->
        <h1 class="wordmark" data-brand-big>LIPATECH</h1>

        <!-- Le portable -->
        <div class="laptop" id="laptop">
          <!-- L'écran (couvercle qui se lève) -->
          <div class="laptop__lid">
            <!-- Face intérieure : l'écran + l'OS -->
            <div class="laptop__screen">
              <span class="laptop__webcam" aria-hidden="true"></span>

              <div class="os" id="os">
                <!-- Barre supérieure (style GNOME) -->
                <div class="topbar">
                  <button class="topbar__activities" type="button">Activités</button>
                  <div class="topbar__clock">
                    <span data-day></span> <span data-clock>--:--</span>
                  </div>
                  <div class="topbar__status" aria-hidden="true">
                    <span class="ico-net"></span>
                    <span class="ico-vol"></span>
                    <span class="ico-bat"></span>
                  </div>
                </div>

                <!-- Dossiers sur le bureau (générés par le JS) -->
                <ul class="desktop-icons" id="desktop-icons" aria-label="Dossiers"></ul>

                <p class="desktop-hint" id="desktop-hint">Double-cliquez sur un dossier — ou utilisez le dock</p>

                <!-- Fenêtres -->
                <div class="windows" id="windows"></div>

                <!-- Dock (style Ubuntu) généré par le JS -->
                <ul class="dock" id="dock" aria-label="Dock"></ul>
              </div>

              <div class="power-on" aria-hidden="true"></div>
              <!-- Capot fermé (façon ThinkPad) : se lève à l'ouverture -->
              <div class="screen-off" aria-hidden="true">
                <div class="tp-logo">ThinkPad<i class="tp-led"></i></div>
              </div>
            </div>
          </div>

          <!-- La base : clavier + TrackPoint -->
          <div class="laptop__base" aria-hidden="true">
            <div class="laptop__hinge"></div>
            <div class="keyboard">
              <span class="trackpoint"></span>
            </div>
            <div class="trackpad"></div>
          </div>
        </div>

        <!-- Bouton d'ouverture -->
        <button class="open-btn" id="open-btn" type="button">
          <span class="open-btn__chevron" aria-hidden="true"></span>
          Ouvrir
        </button>

      </div>
    </div>

    <!-- ---------- MOBILE : un téléphone posé sur le bureau ---------- -->
    <div class="device device--phone">
      <div class="phone">
        <div class="phone__screen">
          <div class="phoneos" id="phoneos">

            <!-- Barre d'état -->
            <div class="statusbar">
              <span class="statusbar__time" data-clock>--:--</span>
              <span class="statusbar__icons">📶 🔋</span>
            </div>

            <!-- Écran d'accueil : nom + grille d'apps (générée par le JS) -->
            <div class="homescreen" id="homescreen">
              <header class="phone-hero">
                <div class="phone-hero__avatar" data-initial></div>
                <h1 data-name></h1>
                <p data-role></p>
              </header>
              <ul class="apps" id="apps" aria-label="Applications"></ul>
              <p class="phone-hint">Touchez une app pour en savoir plus</p>
            </div>

            <!-- Vue d'une app ouverte -->
            <div class="app-view" id="app-view" hidden>
              <header class="app-view__bar">
                <button class="app-view__back" id="app-back" aria-label="Retour">‹ Accueil</button>
                <span class="app-view__title" id="app-title"></span>
              </header>
              <div class="app-view__body" id="app-body"></div>
            </div>

          </div>
        </div>
        <span class="phone__island" aria-hidden="true"></span>
        <span class="phone__home" aria-hidden="true"></span>
        <span class="phone__btn phone__btn--power" aria-hidden="true"></span>
        <span class="phone__btn phone__btn--vup" aria-hidden="true"></span>
        <span class="phone__btn phone__btn--vdn" aria-hidden="true"></span>
      </div>
    </div>

  </div><!-- /.scene -->

  <script src="js/data.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
